<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบคลังย่อย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f5f6f4;--card:#fff;--ink:#1d2321;--quiet:#66706b;--line:#e1e4e0;
  --pri:#0f6b5c;--pri-soft:#e3f1ee;--warn:#b26a00;--warn-soft:#fdf1df;--bad:#b3261e;--bad-soft:#fbe9e7;--ok:#2e7d32;--info:#1f5fa8;--info-soft:#e7f0fb;
  --r:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
h1,h2,h3{margin:0;font-weight:600}
h2{font-size:20px;margin-bottom:4px}
h3{font-size:16px}
.sub{color:var(--quiet);font-size:13px;margin-bottom:16px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:8px 14px;color:var(--ink)}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:500}
button.pri:hover{filter:brightness(1.08)}
button.ghost{border:none;background:none;color:var(--pri);padding:4px 6px}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
input[type=checkbox]{width:auto}
input:focus,select:focus{outline:2px solid var(--pri-soft);border-color:var(--pri)}
label{font-size:13px;color:var(--quiet);display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--quiet);font-size:13px;border-bottom:1px solid var(--line);padding:8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:140px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink);white-space:nowrap}
.b-ok{background:var(--pri-soft);color:var(--pri)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--info-soft);color:var(--info)}
.muted{color:var(--quiet)}
.in{color:var(--ok)}.out{color:var(--bad)}
#login{max-width:380px;margin:12vh auto;padding:0 16px}
#app{display:none;min-height:100vh}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
header .brand{font-weight:600;color:var(--pri)}
header .who{margin-left:auto;font-size:13px;color:var(--quiet);text-align:right}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 20px;background:#fff;border-bottom:1px solid var(--line)}
nav button{border:none;background:none;padding:8px 12px;color:var(--quiet);white-space:nowrap;position:relative}
nav button.on{background:var(--pri-soft);color:var(--pri);font-weight:500}
nav .dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;margin-left:4px;line-height:18px;text-align:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--quiet);white-space:nowrap}
.tabs button.on{border-bottom-color:var(--pri);color:var(--pri);font-weight:500}
main{max-width:1150px;margin:0 auto;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .v{font-size:26px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--quiet)}
.bar{height:10px;border-radius:5px;background:var(--pri)}
.bar.warn{background:var(--warn)}
.bartrack{background:var(--bg);border-radius:5px;flex:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;color:#fff;background:var(--ink);z-index:50;max-width:90vw;display:none}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
.lines td input,.lines td select{padding:6px 8px}
.lines input[data-f=qty]{min-width:80px}.lines select[data-f=uom]{min-width:110px}.lines input[data-f=lot_no]{min-width:100px}
.lines input[data-f=exp_date]{min-width:140px}.lines input[data-f=unit_cost]{min-width:100px}.lines input[data-f=hn],.lines input[data-f=an]{min-width:90px}
.empty{padding:24px;text-align:center;color:var(--quiet)}
.split{display:grid;grid-template-columns:1fr 1.3fr;gap:16px}
@media(max-width:820px){.split{grid-template-columns:1fr}main{padding:12px}}
.clickrow{cursor:pointer}.clickrow:hover{background:var(--bg)}
.sel{background:var(--pri-soft)!important}
.note{background:var(--info-soft);color:var(--info);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h2>ระบบคลังย่อย</h2>
    <div class="sub">ศูนย์การแพทย์ มหาวิทยาลัยวลัยลักษณ์</div>
    <form id="loginForm">
      <label>อีเมล</label><input id="email" type="email" required autocomplete="username">
      <div style="height:10px"></div>
      <label>รหัสผ่าน</label><input id="pw" type="password" required autocomplete="current-password">
      <div style="height:16px"></div>
      <button class="pri" style="width:100%">เข้าสู่ระบบ</button>
      <div id="loginErr" style="color:var(--bad);font-size:13px;margin-top:10px"></div>
    </form>
  </div>
</div>

<div id="app">
  <header>
    <span class="brand">ระบบคลังย่อย</span>
    <div class="who"><div id="whoName"></div><div id="whoRole"></div></div>
    <button id="chpw">เปลี่ยนรหัสผ่าน</button>
    <button id="logout">ออกจากระบบ</button>
  </header>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://oxcrpbmcmzfomsclmdng.supabase.co';
const SUPABASE_KEY = 'sb_publishable_frDUEq0gEkCJBkILHs4Zyw_o55iO_VP';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ROLES = ['requester','unit_head','manager','admin'];
const ROLE_TH = {requester:'ผู้ปฏิบัติงานคลังย่อย (Sub-stock User)', unit_head:'ผู้ดูแลคลังย่อย (Sub-stock Admin)', main_store:'เจ้าหน้าที่คลังใหญ่', manager:'ผู้บริหาร', admin:'ผู้ดูแลระบบ'};
const ROLE_SHORT = {requester:'Sub-stock User', unit_head:'Sub-stock Admin', main_store:'คลังใหญ่', manager:'ผู้บริหาร', admin:'ผู้ดูแลระบบ'};
const TYPE_TH = {REQ:'ใบเบิก',RECV:'รับเข้า',ISSUE:'จ่าย',USE:'จ่ายผู้ป่วย/ตัดใช้',TRF:'โอนย้าย',RET:'คืน',EXP:'ชำรุด/หมดอายุ',ADJ:'ปรับยอด'};
const STATUS_TH = {DRAFT:'ร่าง',SUBMIT:'รออนุมัติ',APPROVE:'อนุมัติแล้ว',SHIPPED:'ระหว่างส่ง',DONE:'เสร็จ',CANCEL:'ยกเลิก'};
const STATUS_CLS = {SUBMIT:'b-warn',APPROVE:'b-ok',SHIPPED:'b-info',CANCEL:'b-bad'};
const ITEMTYPE_TH = {DRUG:'ยา',MEDSUP:'เวชภัณฑ์',OFFICE:'วัสดุสำนักงาน'};

let me = null, stores = [], items = [], storeItems = [], uoms = [], itemUoms = [], rolePages = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d) => { d = typeof d === 'number' ? d : 0; return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d}); };
const baht = n => fmt(n,2);
const dt = s => s ? new Date(s).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}) : '';
const dtt = s => s ? new Date(s).toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
const storeName = id => stores.find(s=>s.store_id===id)?.store_name || '-';
const itemById = id => items.find(i=>i.item_id===id);
const sees = () => ['manager','admin'].includes(me.role);
const subStores = () => stores.filter(s=>s.store_type==='SUB' && s.is_active);
const route = t => (t.from_store_id?esc(storeName(t.from_store_id)):'คลังใหญ่ (ภายนอก)') + (t.to_store_id?' → '+esc(storeName(t.to_store_id)):'');
const statusBadge = s => `<span class="badge ${STATUS_CLS[s]||''}">${STATUS_TH[s]||s}</span>`;
function toast(msg, kind=''){ const t=$('#toast'); t.textContent=msg; t.className='toast '+kind; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', kind==='bad'?6000:3000); }
function errMsg(e){ return (e && (e.message||e.error_description)) || String(e); }
async function must(p){ const r = await p; if (r.error) throw r.error; return r.data; }

// ---------- auth ----------
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#loginErr').textContent='';
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pw').value });
  if (error) { $('#loginErr').textContent = 'เข้าสู่ระบบไม่สำเร็จ: ' + error.message; return; }
  boot();
});
$('#logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
$('#chpw').onclick = () => {
  $('#view').innerHTML = `<div class="card" style="max-width:420px"><h3>เปลี่ยนรหัสผ่าน</h3><div class="sub">อย่างน้อย 8 ตัวอักษร</div>
    <label>รหัสผ่านใหม่</label><input id="np1" type="password" autocomplete="new-password"><div style="height:10px"></div>
    <label>ยืนยันรหัสผ่านใหม่</label><input id="np2" type="password" autocomplete="new-password"><div style="height:16px"></div>
    <button class="pri" id="npSave">บันทึก</button></div>`;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('on'));
  $('#npSave').onclick = async () => {
    const a=$('#np1').value, b=$('#np2').value;
    if (a.length<8) return toast('รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร','bad');
    if (a!==b) return toast('รหัสผ่านทั้งสองช่องไม่ตรงกัน','bad');
    const { error } = await sb.auth.updateUser({ password:a });
    if (error) toast(error.message,'bad'); else { toast('เปลี่ยนรหัสผ่านแล้ว','ok'); go(current); }
  };
};

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return;
  const { data: prof } = await sb.from('profile').select('*').eq('user_id', session.user.id).maybeSingle();
  if (!prof || !prof.is_active) {
    $('#loginErr').textContent = 'บัญชีนี้ยังไม่ได้กำหนดบทบาทหรือถูกปิดใช้งาน กรุณาติดต่อผู้ดูแลระบบ';
    await sb.auth.signOut(); return;
  }
  me = prof;
  await loadMaster();
  $('#login').style.display='none'; $('#app').style.display='block';
  $('#whoName').textContent = me.full_name;
  $('#whoRole').textContent = ROLE_SHORT[me.role] + (me.store_id ? ' · ' + storeName(me.store_id) : '');
  buildNav();
}
async function loadMaster(){
  const [s,i,si,u,iu,rp] = await Promise.all([
    sb.from('store').select('*').order('store_type').order('store_name'),
    sb.from('item').select('*').order('item_name'),
    sb.from('store_item').select('*'),
    sb.from('uom').select('*').order('uom_name'),
    sb.from('item_uom').select('*'),
    sb.from('role_page').select('*'),
  ]);
  stores = s.data||[]; items = i.data||[]; storeItems = si.data||[]; uoms = u.data||[]; itemUoms = iu.data||[]; rolePages = rp.data||[];
}

// ---------- nav ----------
const PAGES = {
  dash:    {t:'Dashboard',              fn:pageDash},
  req:     {t:'ขอเบิกและรับเข้า',        fn:pageReq},
  disp:    {t:'ตัดจ่ายและโอนย้าย',       fn:pageDisp},
  approve: {t:'อนุมัติ',                fn:pageApprove},
  card:    {t:'Stock Card และรายงาน',    fn:pageCard},
  alert:   {t:'แจ้งเตือน',              fn:pageAlert},
  master:  {t:'สินค้าประจำคลัง',         fn:pageMaster},
  uom:     {t:'หน่วยนับ',               fn:pageUom},
  setup:   {t:'Setup & Access',         fn:pageSetup},
};
const PAGE_DESC = {
  dash:'ภาพรวมมูลค่า หมดอายุ ต่ำกว่า Min', req:'สร้างใบเบิก รับเข้าพร้อมราคา รับของโอน ประวัติการเบิก', disp:'จ่ายผู้ป่วย โอนระหว่างคลังย่อย ชำรุด/หมดอายุ',
  approve:'อนุมัติใบเบิก โอน ตัดชำรุด ปรับยอด',
  card:'บัญชีคุมคลัง ยอดคงเหลือ ความเคลื่อนไหว', alert:'ใกล้หมดอายุ ต่ำกว่า Min รอรับเข้า', master:'สินค้าที่ผูกกับคลัง Min/Max ราคาทุนเฉลี่ย',
  uom:'หน่วยนับและอัตราแปลง', setup:'คลัง/หน่วยงาน ผู้ใช้ สิทธิ์หน้าจอ'};
const canPage = (k, role=me.role) => (role==='admin' && k==='setup') || rolePages.some(r=>r.role===role && r.page_key===k && r.allowed);
let current = null;
function buildNav(){
  const keys = Object.keys(PAGES).filter(k => canPage(k));
  $('#nav').innerHTML = keys.map(k=>`<button data-k="${k}">${PAGES[k].t}<span class="dot" id="dot-${k}" style="display:none"></span></button>`).join('');
  $('#nav').onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.k); };
  const h = location.hash.slice(1);
  go(keys.includes(h) ? h : keys[0]);
  refreshDots();
}
function go(k){
  if (!k || !canPage(k)) { $('#view').innerHTML='<div class="card">ไม่มีสิทธิ์เข้าหน้านี้</div>'; return; }
  current = k;
  $('#view').onclick = null;
  try { history.replaceState(null,'','#'+k); } catch(_){}
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.k===k));
  $('#view').innerHTML = '<div class="empty">กำลังโหลด…</div>';
  PAGES[k].fn().catch(e => { $('#view').innerHTML = `<div class="card" style="color:var(--bad)">เกิดข้อผิดพลาด: ${esc(errMsg(e))}</div>`; });
}
async function refreshDots(){
  const setDot = (k,n) => { const d=$('#dot-'+k); if (d) { d.textContent=n; d.style.display=n?'inline-block':'none'; } };
  try {
    const { data } = await sb.from('stock_txn').select('txn_id,txn_type,status,from_store_id,to_store_id,created_by').in('status',['SUBMIT','SHIPPED','APPROVE']);
    const L = data||[];
    setDot('approve', L.filter(t=>t.status==='SUBMIT' && canApprove(t)).length);
    setDot('req', L.filter(t=>t.to_store_id===me.store_id && (t.status==='SHIPPED' || (t.status==='APPROVE' && t.txn_type==='REQ'))).length);
  } catch(_){}
}
function canApprove(t){
  if (t.created_by === me.user_id) return false;
  if (t.txn_type==='ADJ') return ['manager','admin'].includes(me.role);
  if (['manager','admin'].includes(me.role)) return true;
  return me.role==='unit_head' && me.store_id === (t.txn_type==='REQ' ? t.to_store_id : t.from_store_id);
}
function tabs(list, onPick, start){
  const id = 'tb'+Math.random().toString(36).slice(2,7);
  const html = `<div class="tabs" id="${id}">${list.map(([k,t])=>`<button data-t="${k}">${t}</button>`).join('')}</div><div id="${id}-body"></div>`;
  setTimeout(()=>{
    const el = document.getElementById(id); if (!el) return;
    const pick = k => { el.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.t===k)); const body=document.getElementById(id+'-body'); body.onclick=null; body.innerHTML='<div class="empty">กำลังโหลด…</div>';
      Promise.resolve(onPick(k, document.getElementById(id+'-body'))).catch(e=>{ document.getElementById(id+'-body').innerHTML=`<div class="card" style="color:var(--bad)">${esc(errMsg(e))}</div>`; }); };
    el.onclick = e => { const b=e.target.closest('button'); if (b) pick(b.dataset.t); };
    pick(start || list[0][0]);
  });
  return html;
}
// store picker for pages that act "as" a sub-store
function storePicker(id, list, sel){
  return `<select id="${id}">${list.map(s=>`<option value="${s.store_id}" ${s.store_id===sel?'selected':''}>${esc(s.store_name)}</option>`).join('')}</select>`;
}

// ---------- shared helpers ----------
function itemOptions(list, sel){
  return '<option value="">— เลือกรายการ —</option>' + list.map(i =>
    `<option value="${i.item_id}" ${i.item_id==sel?'selected':''}>${esc(i.item_name)} (${esc(i.item_code)})${i.is_high_alert?' ⚠':''}</option>`).join('');
}
function uomFactor(it, u){
  if (!it || !u || u === it.base_unit) return 1;
  return Number(itemUoms.find(x=>x.item_id===it.item_id && x.uom_name===u)?.factor || 1);
}
function uomOptions(it, sel){
  if (!it) return '<option value=""></option>';
  const list = [{uom_name:it.base_unit, factor:1}, ...itemUoms.filter(x=>x.item_id===it.item_id)];
  return list.map(x=>`<option value="${esc(x.uom_name)}" ${x.uom_name===(sel||it.base_unit)?'selected':''}>${esc(x.uom_name)}${x.factor!=1?` (${fmt(x.factor)} ${esc(it.base_unit)})`:''}</option>`).join('');
}
// lots: array of balance rows {item_id, lot_no, exp_date, qty_on_hand}
function lotOptions(lots, itemId, sel){
  const L = (lots||[]).filter(l=>l.item_id===itemId && Number(l.qty_on_hand)>0);
  return `<option value="">ตาม FEFO</option>` + L.map(l=>`<option value="${esc(l.lot_no)}" ${l.lot_no===sel?'selected':''}>${esc(l.lot_no)} · หมด ${dt(l.exp_date)} · มี ${fmt(l.qty_on_hand)}</option>`).join('');
}
function lineEditor(el, opts){
  // cols: uom, lot, lotsel, exp, cost, hn, info
  const rows = opts.initial ? [...opts.initial] : [{}];
  const c = opts.cols || [];
  function render(){
    el.innerHTML = `<div style="overflow-x:auto"><table class="lines"><thead><tr><th style="min-width:220px">รายการ</th><th class="num" style="width:100px">จำนวน</th>
      ${c.includes('uom')?'<th style="width:150px">หน่วย</th>':''}
      ${c.includes('lot')?'<th style="width:120px">Lot</th>':''}
      ${c.includes('lotsel')?'<th style="width:230px">Lot</th>':''}
      ${c.includes('exp')?'<th style="width:150px">วันหมดอายุ</th>':''}
      ${c.includes('cost')?'<th class="num" style="width:110px">ราคา/หน่วย</th>':''}
      ${c.includes('hn')?'<th style="width:110px">HN</th><th style="width:110px">AN</th>':''}
      ${c.includes('info')?'<th>ข้อมูล</th>':''}
      <th style="width:36px"></th></tr></thead><tbody>
      ${rows.map((r,ix)=>{
        const it = itemById(+r.item_id);
        return `<tr data-ix="${ix}">
        <td><select data-f="item_id">${itemOptions(opts.itemList(), r.item_id)}</select></td>
        <td><input data-f="qty" type="number" min="0" step="any" value="${r.qty??''}" style="text-align:right"></td>
        ${c.includes('uom')?`<td><select data-f="uom">${uomOptions(it, r.uom)}</select></td>`:''}
        ${c.includes('lot')?`<td><input data-f="lot_no" value="${esc(r.lot_no||'')}"></td>`:''}
        ${c.includes('lotsel')?`<td><select data-f="lot_no">${it?lotOptions(opts.lots(), it.item_id, r.lot_no):''}</select></td>`:''}
        ${c.includes('exp')?`<td><input data-f="exp_date" type="date" value="${r.exp_date||''}"></td>`:''}
        ${c.includes('cost')?`<td><input data-f="unit_cost" type="number" step="any" value="${r.unit_cost??(it?.unit_cost??'')}" style="text-align:right"></td>`:''}
        ${c.includes('hn')?`<td><input data-f="hn" value="${esc(r.hn||'')}" placeholder="${it?.is_high_alert?'จำเป็น':'ไม่บังคับ'}"></td><td><input data-f="an" value="${esc(r.an||'')}" placeholder="ไม่บังคับ"></td>`:''}
        ${c.includes('info')?`<td class="muted" style="font-size:13px">${opts.info? opts.info(r):''}</td>`:''}
        <td><button class="ghost" data-del="${ix}" title="ลบ">✕</button></td></tr>`}).join('')}
      </tbody></table></div>
      <div style="margin-top:8px"><button class="ghost" data-add>+ เพิ่มรายการ</button></div>`;
  }
  el.addEventListener('change', e => {
    const tr = e.target.closest('tr[data-ix]'); if (!tr) return;
    const f = e.target.dataset.f; const row = rows[+tr.dataset.ix]; row[f] = e.target.value;
    if (f==='item_id') { const it=itemById(+e.target.value); row.uom = it?.base_unit; row.lot_no=''; if (c.includes('cost')) row.unit_cost = it?.unit_cost; render(); }
    else if (f==='uom') { const it=itemById(+row.item_id); if (c.includes('cost') && it) row.unit_cost = +(Number(it.unit_cost||0) * uomFactor(it, row.uom)).toFixed(2); render(); }
    else if (opts.info && (f==='qty'||f==='lot_no')) render();
  });
  el.addEventListener('click', e => {
    if (e.target.dataset.add!==undefined) { rows.push({}); render(); }
    if (e.target.dataset.del!==undefined) { rows.splice(+e.target.dataset.del,1); if(!rows.length) rows.push({}); render(); }
  });
  render();
  return {
    get: () => rows.filter(r=>r.item_id && Number(r.qty)>0).map(r=>{
      const f = c.includes('uom') ? uomFactor(itemById(+r.item_id), r.uom) : 1;
      const cost = r.unit_cost===''||r.unit_cost==null ? null : Number(r.unit_cost)/f;
      return {...r, item_id:+r.item_id, qty:Number(r.qty)*f, unit_cost: cost==null?null:+cost.toFixed(2)};
    }),
    set: (rs) => { rows.length=0; rows.push(...(rs.length?rs:[{}])); render(); },
    rerender: render,
  };
}
// create txn + lines (+post). Cleans up on failure.
async function createTxn(head, lines, post){
  const wantStatus = head.status;
  const { data: t, error } = await sb.from('stock_txn').insert({...head, status:'DRAFT'}).select().single();
  if (error) throw error;
  const payload = lines.map((l,ix)=>({
    txn_id:t.txn_id, line_no:ix+1, item_id:l.item_id, qty:l.qty,
    lot_no:l.lot_no||null, exp_date:l.exp_date||null,
    unit_cost: l.unit_cost===''||l.unit_cost==null ? null : Number(l.unit_cost),
    hn:l.hn||null, an:l.an||null }));
  const r = await sb.from('stock_txn_line').insert(payload);
  if (r.error) { await sb.from('stock_txn').delete().eq('txn_id', t.txn_id); throw r.error; }
  if (wantStatus === 'SUBMIT') {
    const u = await sb.from('stock_txn').update({status:'SUBMIT'}).eq('txn_id', t.txn_id);
    if (u.error) { await sb.from('stock_txn').delete().eq('txn_id', t.txn_id); throw u.error; }
    t.status = 'SUBMIT';
  }
  if (post) {
    const p = await sb.rpc('post_txn', { p_txn_id: t.txn_id });
    if (p.error) { await sb.from('stock_txn').delete().eq('txn_id', t.txn_id); throw p.error; }
  }
  refreshDots();
  return t;
}

  }[kind];

    ${items.map(i=>`<tr data-id="${i.item_id}"><td>${esc(i.item_code)}</td><td><input data-f="item_name" value="${esc(i.item_name)}"></td><td>${ITEMTYPE_TH[i.item_type]}</td><td>${esc(i.base_unit)}</td>
      <td class="muted" style="font-size:13px">${storeItems.filter(x=>x.item_id===i.item_id).length} คลัง</td>
      <td><input type="checkbox" data-f="is_high_alert" ${i.is_high_alert?'checked':''}></td><td><input type="checkbox" data-f="is_active" ${i.is_active?'checked':''}></td>
      <td><button class="ghost" data-save="${i.item_id}">บันทึก</button></td></tr>`).join('')}
    </tbody></table></div></div>`;
  el.onclick = async e => {
    const id = e.target.dataset.save; if (!id) return;
    const tr = e.target.closest('tr'); const g = f => tr.querySelector(`[data-f="${f}"]`);
    const { error } = await sb.from('item').update({item_name:g('item_name').value.trim(), is_high_alert:g('is_high_alert').checked, is_active:g('is_active').checked}).eq('item_id', +id);
    if (error) toast(error.message,'bad'); else { toast('บันทึกแล้ว','ok'); await loadMaster(); }
  };
}
async function pageUom(){
  $('#view').innerHTML = `<h2>หน่วยนับสินค้า</h2><div class="sub">ตั้งรายชื่อหน่วยนับ และอัตราแปลงหน่วยของแต่ละสินค้า (เช่น 1 กล่อง = 100 ชิ้น) เพื่อใช้ตอนรับเข้า</div>
    <div class="split" style="grid-template-columns:1fr 1fr">
      <div class="card" id="ucard"><h3 style="margin-bottom:12px">รายชื่อหน่วยนับ (${uoms.length})</h3>
        <div class="row" style="margin-bottom:12px"><div><label>เพิ่มหน่วยใหม่</label><input id="nu" placeholder="เช่น ขวด"></div><div style="flex:0"><button class="pri" id="addU">เพิ่ม</button></div></div>
        <div style="max-height:420px;overflow:auto"><table><thead><tr><th>หน่วย</th><th>ใช้ในสินค้า</th><th>สถานะ</th><th></th></tr></thead><tbody>
        ${uoms.map(u=>{ const n = items.filter(i=>i.base_unit===u.uom_name).length + itemUoms.filter(x=>x.uom_name===u.uom_name).length;
          return `<tr><td>${esc(u.uom_name)}</td><td class="muted">${n||''}</td><td>${u.is_active?'<span class="badge b-ok">ใช้งาน</span>':'<span class="badge">ปิด</span>'}</td>
          <td style="text-align:right"><button class="ghost" data-tog="${u.uom_id}">${u.is_active?'ปิดใช้':'เปิดใช้'}</button>${n?'':`<button class="ghost danger" data-delu="${u.uom_id}">ลบ</button>`}</td></tr>`; }).join('')}
        </tbody></table></div></div>
      <div class="card"><h3 style="margin-bottom:12px">อัตราแปลงหน่วยของสินค้า</h3>
        <label>สินค้า</label><select id="ci">${itemOptions(items)}</select>
        <div id="conv" style="margin-top:12px"><div class="empty">เลือกสินค้า</div></div></div>
    </div>`;
  const reload = async () => { await loadMaster(); go('uom'); };
  $('#addU').onclick = async () => {
    const n = $('#nu').value.trim(); if (!n) return toast('กรอกชื่อหน่วย','bad');
    const { error } = await sb.from('uom').insert({uom_name:n});
    if (error) return toast(error.code==='23505'?'มีหน่วยนี้อยู่แล้ว':error.message,'bad'); toast('เพิ่มแล้ว','ok'); reload();
  };
  $('#ucard').addEventListener('click', async e => {
    const tog = e.target.dataset.tog, del = e.target.dataset.delu;
    if (tog) { const u = uoms.find(x=>x.uom_id==tog);
      const { error } = await sb.from('uom').update({is_active:!u.is_active}).eq('uom_id', u.uom_id);
      if (error) return toast(error.message,'bad'); reload(); }
    if (del) { const { error } = await sb.from('uom').delete().eq('uom_id', +del);
      if (error) return toast('ลบไม่ได้: หน่วยนี้ถูกใช้อยู่','bad'); toast('ลบแล้ว','ok'); reload(); }
  });
  const renderConv = () => {
    const it = itemById(+$('#ci').value); if (!it) { $('#conv').innerHTML='<div class="empty">เลือกสินค้า</div>'; return; }
    const cur = itemUoms.filter(x=>x.item_id===it.item_id);
    $('#conv').innerHTML = `<div class="sub">หน่วยฐาน: <b>${esc(it.base_unit)}</b> · ยอดคงคลังเก็บเป็นหน่วยฐานเสมอ</div>
      <table><thead><tr><th>หน่วย</th><th class="num">เท่ากับ</th><th></th></tr></thead><tbody>
      ${cur.map(x=>`<tr><td>1 ${esc(x.uom_name)}</td><td class="num">${fmt(x.factor,2)} ${esc(it.base_unit)}</td><td style="text-align:right"><button class="ghost danger" data-delc="${esc(x.uom_name)}">ลบ</button></td></tr>`).join('')}
      <tr><td><select id="cu"><option value="">— หน่วย —</option>${uoms.filter(u=>u.is_active && u.uom_name!==it.base_unit && !cur.some(c=>c.uom_name===u.uom_name)).map(u=>`<option>${esc(u.uom_name)}</option>`).join('')}</select></td>
      <td><input id="cf" type="number" step="any" min="0" placeholder="จำนวน ${esc(it.base_unit)}" style="text-align:right"></td><td><button class="pri" id="addC">เพิ่ม</button></td></tr></tbody></table>`;
  };
  $('#ci').onchange = renderConv;
  $('#conv').addEventListener('click', async e => {
    const it = itemById(+$('#ci').value); if (!it) return;
    if (e.target.id==='addC') {
      const rec = {item_id:it.item_id, uom_name:$('#cu').value, factor:Number($('#cf').value)};
      if (!rec.uom_name || !(rec.factor>0)) return toast('เลือกหน่วยและใส่จำนวนมากกว่า 0','bad');
      const { error } = await sb.from('item_uom').insert(rec);
      if (error) return toast(error.message,'bad'); toast('เพิ่มแล้ว','ok'); await loadMaster(); renderConv();
    }
    if (e.target.dataset.delc) {
      const { error } = await sb.from('item_uom').delete().eq('item_id', it.item_id).eq('uom_name', e.target.dataset.delc);
      if (error) return toast(error.message,'bad'); await loadMaster(); renderConv();
    }
  });
}

boot();
</script>
</body>
